name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    name: Hassfest
    uses: pschmitt/ci-workflows/.github/workflows/home-assistant-hassfest.yaml@main

  ruff:
    name: Ruff
    uses: pschmitt/ci-workflows/.github/workflows/home-assistant-ruff.yaml@main
    with:
      uv-v5: true
